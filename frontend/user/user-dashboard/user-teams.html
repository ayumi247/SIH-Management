<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Requests | SIH Matchmaker</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
        <div id="navbar-container"></div>
        <div class="main-content animate-fade-in">
             <div style="display: flex; justify-content: space-between; align-items: center;">
                 <h2>Join Requests</h2>
                 <button class="btn btn-secondary btn-sm" id="toggle-sent-btn" onclick="toggleSentInvites()">Invites Sent</button>
             </div>
             <hr style="border-color: var(--border-light); margin: 1rem 0 2rem 0;">
             <div id="page-content">
                <div class="glass-card" style="margin-bottom: 2rem;">
    <h3 id="invites-title" style="color: var(--neon-cyan);">Incoming Invites</h3>
    <p id="invites-desc" style="color: var(--text-secondary);">Manage your team join requests here.</p>
</div>
<div id="invites-list" style="display: flex; flex-direction: column; gap: 1rem;">
    <!-- Invites injected here -->
</div>
<div id="sent-invites-list" style="display: none; flex-direction: column; gap: 1rem;">
    <!-- Sent Invites injected here -->
</div>
<script>
    let showingSent = false;

    async function initPage(user) {
        loadIncomingInvites();
    }
    
    async function loadIncomingInvites() {
        try {
            const invites = await fetchAPI('/invites/incoming');
            
            if (invites.length === 0) {
                document.getElementById('invites-list').innerHTML = '<p>No pending invites right now.</p>';
                return;
            }
            
            let html = '';
            for(let inv of invites) {
                let title, subtitle;
                if (inv.target_team_id) {
                    // A student is requesting to join the team
                    title = `Request from ${inv.sender_name || 'Student'}`;
                    subtitle = `To join team: ${inv.target_team_name || inv.target_team_id}`;
                } else {
                    // A team is inviting the student
                    title = `Invite from Team: ${inv.sender_team_name || 'Unknown'}`;
                    subtitle = `Sent by: ${inv.sender_name || inv.sender_id}`;
                }
                
                if (inv.status === 'Pending') {
                    html += `
                        <div class="glass-card" style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h4>${title}</h4>
                                <p style="font-size: 0.9rem; color: var(--text-secondary);">${subtitle}</p>
                            </div>
                            <div style="display: flex; gap: 0.5rem;">
                                <button class="btn btn-primary" onclick="handleInvite('${inv.id}', 'accept')" style="padding: 0.5rem 1rem;">Accept</button>
                                <button class="btn btn-secondary" onclick="handleInvite('${inv.id}', 'reject')" style="padding: 0.5rem 1rem;">Reject</button>
                            </div>
                        </div>
                    `;
                }
            }
            
            if (!html) html = '<p>No pending invites right now.</p>';
            document.getElementById('invites-list').innerHTML = html;
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    async function loadSentInvites() {
        try {
            const invites = await fetchAPI('/invites/sent');
            
            if (invites.length === 0) {
                document.getElementById('sent-invites-list').innerHTML = '<p>You have not sent any invites.</p>';
                return;
            }
            
            let html = '';
            for(let inv of invites) {
                let targetInfo;
                if (inv.target_team_id) {
                    targetInfo = `Team: ${inv.target_team_name || inv.target_team_id}`;
                } else {
                    targetInfo = `Student: ${inv.target_user_name || inv.target_user_id}`;
                }
                
                html += `
                    <div class="glass-card" style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h4>Invite Sent</h4>
                            <p style="font-size: 0.9rem; color: var(--text-secondary);">To ${targetInfo}</p>
                        </div>
                        <div>
                            <span style="color: ${inv.status === 'Pending' ? 'var(--neon-pink)' : (inv.status === 'Accepted' ? 'var(--neon-cyan)' : 'gray')}; font-weight: bold;">${inv.status}</span>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('sent-invites-list').innerHTML = html;
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }
    
    function toggleSentInvites() {
        showingSent = !showingSent;
        const btn = document.getElementById('toggle-sent-btn');
        const title = document.getElementById('invites-title');
        const desc = document.getElementById('invites-desc');
        
        if (showingSent) {
            btn.innerText = 'Incoming Invites';
            title.innerText = 'Sent Invites';
            desc.innerText = 'Track the status of join requests you have sent.';
            document.getElementById('invites-list').style.display = 'none';
            document.getElementById('sent-invites-list').style.display = 'flex';
            loadSentInvites();
        } else {
            btn.innerText = 'Invites Sent';
            title.innerText = 'Incoming Invites';
            desc.innerText = 'Manage your team join requests here.';
            document.getElementById('sent-invites-list').style.display = 'none';
            document.getElementById('invites-list').style.display = 'flex';
            loadIncomingInvites();
        }
    }
    
    async function handleInvite(id, action) {
        try {
            await fetchAPI(`/invites/${id}/${action}`, { method: 'PUT' });
            alert(`Invite ${action}ed!`);
            window.location.reload();
        } catch(error) {
            alert('Error: ' + error.message);
        }
    }
</script>
             </div>
        </div>
    </div>
    
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth('User');
            if (user) {
                await loadComponent('sidebar-container', '../components/user-sidebar.html');
                await loadComponent('navbar-container', '../components/user-navbar.html');
                
                // Highlight active sidebar link
                setTimeout(() => {
                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(link => {
                        if (link.href === window.location.href) {
                            link.classList.add('active');
                        }
                    });
                }, 100);
                
                if (typeof initPage === 'function') {
                    initPage(user);
                }
            }
        });
    </script>
</body>
</html>
