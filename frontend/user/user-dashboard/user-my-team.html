<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team | SIH Matchmaker</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
        <div id="navbar-container"></div>
        <div class="main-content animate-fade-in">
             <h2>My Team</h2>
             <hr style="border-color: var(--border-light); margin: 1rem 0 2rem 0;">
             <div id="page-content">
                <div id="no-team-msg" style="display: none;" class="glass-card">
    <p>You are not in a team. <a href="user-create-team.html" style="color: var(--neon-cyan);">Create one</a>.</p>
</div>
<div id="team-content" style="display: none;">
    <div class="glass-card" style="margin-bottom: 1.5rem; position: relative;">
        <div id="team-actions" style="position: absolute; right: 1.5rem; top: 1.5rem; display: flex; gap: 0.5rem;">
            <button id="edit-team-btn" class="btn btn-secondary btn-sm" onclick="openEditModal()">Edit Team</button>
            <button id="leave-team-btn" class="btn btn-sm" style="display: none; background: rgba(220,53,69,0.2); color: #ff6b6b; border: 1px solid #ff6b6b;" onclick="leaveTeam()">Leave Team</button>
            <button id="delete-team-btn" class="btn btn-sm" style="display: none; background: rgba(220,53,69,0.2); color: #ff6b6b; border: 1px solid #ff6b6b;" onclick="deleteTeam()">Delete Team</button>
        </div>
        <h3 id="team-name" style="color: var(--neon-cyan); font-size: 2rem;"></h3>
        <p style="margin: 0.5rem 0;">Problem Statement: <span id="team-ps" class="font-mono" style="color: var(--text-primary);"></span></p>
        <p>Status: <span id="team-status-badge" style="color: var(--text-primary); padding: 0.25rem 0.75rem; background: rgba(255,255,255,0.1); border-radius: 12px; font-size: 0.85rem;"></span></p>
    </div>
    
    <h4 style="margin-bottom: 1rem;">Team Members (<span id="member-count"></span>/6)</h4>
    <div id="members-list" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- Members injected here -->
    </div>
</div>

<!-- Edit Team Modal -->
<div id="edit-team-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
    <div class="glass-card" style="width: 100%; max-width: 500px; padding: 2rem; position: relative;">
        <h3 style="margin-bottom: 1.5rem;">Edit Team</h3>
        <form id="editTeamForm">
            <div class="form-group">
                <label class="form-label">Team Name</label>
                <input type="text" id="edit_team_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Problem Statement</label>
                <input type="text" id="edit_problem_statement" class="form-control" placeholder="e.g. SIH1234 (Optional)">
            </div>
            <div class="form-group">
                <label class="form-label">Required Skills (Comma separated)</label>
                <input type="text" id="edit_required_skills" class="form-control" required>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeEditModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script>
    let currentTeamData = null;

    function openEditModal() {
        if(!currentTeamData) return;
        document.getElementById('edit_team_name').value = currentTeamData.name;
        document.getElementById('edit_problem_statement').value = currentTeamData.problem_statement_id || '';
        document.getElementById('edit_required_skills').value = currentTeamData.required_skills;
        document.getElementById('edit-team-modal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('edit-team-modal').style.display = 'none';
    }

    document.getElementById('editTeamForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('edit_team_name').value;
        const ps = document.getElementById('edit_problem_statement').value;
        const skills = document.getElementById('edit_required_skills').value;
        try {
            await fetchAPI('/teams/my-team', {
                method: 'PATCH',
                body: JSON.stringify({ name: name, problem_statement_id: ps || null, required_skills: skills })
            });
            alert('Team updated successfully!');
            window.location.reload();
        } catch (error) {
            alert(error.message);
        }
    });

    async function leaveTeam() {
        if (!confirm('Are you sure you want to leave this team?')) return;
        try {
            await fetchAPI('/teams/leave', { method: 'POST' });
            alert('Successfully left the team.');
            window.location.reload();
        } catch (error) {
            alert(error.message);
        }
    }

    async function deleteTeam() {
        if (!confirm('Are you sure you want to delete this team? All members will be removed.')) return;
        try {
            await fetchAPI('/teams/my-team', { method: 'DELETE' });
            alert('Team deleted successfully.');
            window.location.reload();
        } catch (error) {
            alert(error.message);
        }
    }

    async function initPage(user) {
        if (!user.team_id) {
            document.getElementById('no-team-msg').style.display = 'block';
            return;
        }
        
        document.getElementById('team-content').style.display = 'block';
        
        try {
            const team = await fetchAPI(`/teams/my-team`);
            currentTeamData = team;
            document.getElementById('team-name').innerText = team.name;
            document.getElementById('team-ps').innerText = team.problem_statement_id || 'Not specified';
            document.getElementById('team-status-badge').innerText = team.status;
            
            const members = team.members;
            document.getElementById('member-count').innerText = members.length;
            
            if (user.id === team.leader_id) {
                document.getElementById('delete-team-btn').style.display = 'block';
            } else {
                document.getElementById('leave-team-btn').style.display = 'block';
            }
            
            const html = members.map(m => `
                <div class="glass-card" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>${m.name}</strong> 
                        <span style="font-size: 0.8rem; color: var(--text-secondary);">(${m.gender})</span>
                        ${m.id === team.leader_id ? '<span style="font-size: 0.8rem; color: var(--neon-cyan); margin-left: 0.5rem; font-weight: bold;">(Team Leader)</span>' : ''}
                    </div>
                    <div style="color: var(--text-secondary);">${m.branch} - Year ${m.year}</div>
                </div>
            `).join('');
            
            document.getElementById('members-list').innerHTML = html;
        } catch (error) {
            alert('Failed to load team details: ' + error.message);
        }
    }
</script>
             </div>
        </div>
    </div>
    
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth('User');
            if (user) {
                await loadComponent('sidebar-container', '../components/user-sidebar.html');
                await loadComponent('navbar-container', '../components/user-navbar.html');
                
                // Highlight active sidebar link
                setTimeout(() => {
                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(link => {
                        if (link.href === window.location.href) {
                            link.classList.add('active');
                        }
                    });
                }, 100);
                
                if (typeof initPage === 'function') {
                    initPage(user);
                }
            }
        });
    </script>
</body>
</html>
