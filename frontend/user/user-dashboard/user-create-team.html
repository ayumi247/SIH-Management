<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Team | SIH Matchmaker</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
        <div id="navbar-container"></div>
        <div class="main-content animate-fade-in">
             <h2>Create a Team</h2>
             <hr style="border-color: var(--border-light); margin: 1rem 0 2rem 0;">
             <div id="page-content">
                <div class="glass-card" style="max-width: 600px;">
    <form id="createTeamForm">
        <div class="form-group">
            <label class="form-label">Team Name</label>
            <input type="text" id="team_name" class="form-control" required placeholder="Enter a unique team name">
        </div>
        <div class="form-group">
            <label class="form-label">Problem Statement</label>
            <input type="text" id="problem_statement" class="form-control" required placeholder="e.g. SIH1234">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Team</button>
    </form>
</div>
<script>
    async function initPage(user) {
        if(user.team_id) {
            document.getElementById('page-content').innerHTML = '<div class="glass-card"><p>You are already in a team. You cannot create another one.</p></div>';
            return;
        }
        
        document.getElementById('createTeamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('team_name').value;
            const ps = document.getElementById('problem_statement').value;
            try {
                await fetchAPI('/teams', {
                    method: 'POST',
                    body: JSON.stringify({ name, problem_statement: ps })
                });
                alert('Team created successfully! You are now the team leader.');
                window.location.href = 'user-my-team.html';
            } catch (error) {
                alert(error.message);
            }
        });
    }
</script>
             </div>
        </div>
    </div>
    
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth('User');
            if (user) {
                await loadComponent('sidebar-container', '../components/user-sidebar.html');
                await loadComponent('navbar-container', '../components/user-navbar.html');
                
                // Highlight active sidebar link
                setTimeout(() => {
                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(link => {
                        if (link.href === window.location.href) {
                            link.classList.add('active');
                        }
                    });
                }, 100);
                
                if (typeof initPage === 'function') {
                    initPage(user);
                }
            }
        });
    </script>
</body>
</html>
