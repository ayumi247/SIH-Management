<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Members | Super Admin Dashboard</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
        <div id="navbar-container"></div>
        <div class="main-content animate-fade-in">
             <h2>Registered Members</h2>
             <hr style="border-color: var(--border-light); margin: 1rem 0 2rem 0;">
             <div id="page-content">
                
                <div id="colleges-view">
                    <div class="glass-card" style="margin-bottom: 2rem;">
                        <p style="color: var(--text-secondary);">Select a college to view all its registered students and their complete data.</p>
                    </div>
                    <div id="colleges-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
                        <!-- Colleges injected here -->
                    </div>
                </div>

                <div id="students-view" style="display: none;">
                    <button class="btn btn-secondary btn-sm" style="margin-bottom: 1rem;" onclick="showCollegesView()">← Back to Colleges</button>
                    <div class="glass-card" style="margin-bottom: 2rem;">
                        <h3 id="selected-college-name" style="color: var(--neon-cyan);">College Name</h3>
                        <p style="color: var(--text-secondary);">Complete database of all students registered in this college.</p>
                    </div>
                    <div id="students-list" style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- Students injected here -->
                    </div>
                </div>

<script>
    async function initPage(user) {
        try {
            const colleges = await fetchAPI('/superadmin/colleges');
            
            if (colleges.length === 0) {
                document.getElementById('colleges-list').innerHTML = '<p>No colleges registered in the database.</p>';
                return;
            }
            
            const html = colleges.map(c => `
                <div class="glass-card" style="cursor: pointer;" onclick="loadCollegeUsers('${c.id}', '${c.name.replace(/'/g, "\\'")}')">
                    <h4 style="color: var(--neon-cyan);">${c.name}</h4>
                    <p style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.5rem;">Status: ${c.is_active ? 'Active' : 'Inactive'}</p>
                    <button class="btn btn-primary btn-sm" style="margin-top: 1rem; width: 100%;">View Students</button>
                </div>
            `).join('');
            
            document.getElementById('colleges-list').innerHTML = html;
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    async function loadCollegeUsers(collegeId, collegeName) {
        document.getElementById('colleges-view').style.display = 'none';
        document.getElementById('students-view').style.display = 'block';
        document.getElementById('selected-college-name').innerText = collegeName;
        document.getElementById('students-list').innerHTML = '<p>Loading students...</p>';

        try {
            const students = await fetchAPI(`/superadmin/colleges/${collegeId}/users`);
            
            if (students.length === 0) {
                document.getElementById('students-list').innerHTML = '<p>No students registered from this college yet.</p>';
                return;
            }
            
            const html = students.map(s => `
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                        <h4 style="margin: 0; color: #fff;">${s.name}</h4>
                        <span style="font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: ${s.role === 'Admin' ? 'rgba(255, 0, 255, 0.2)' : 'rgba(0, 255, 255, 0.2)'}; color: ${s.role === 'Admin' ? 'var(--neon-pink)' : 'var(--neon-cyan)'};">
                            Role: ${s.role}
                        </span>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.9rem; color: var(--text-secondary);">
                        <div>
                            <strong>Email:</strong> ${s.email}<br>
                            <strong>Phone:</strong> ${s.phone}<br>
                            <strong>Enrollment No:</strong> ${s.enrollment_no}<br>
                            <strong>Gender:</strong> ${s.gender}
                        </div>
                        <div>
                            <strong>Branch:</strong> ${s.branch}<br>
                            <strong>Year:</strong> ${s.year}<br>
                            <strong>Team ID:</strong> ${s.team_id || 'None'}<br>
                            ${s.position ? `<strong>Position:</strong> ${s.position}` : ''}
                        </div>
                    </div>
                    ${s.skills ? `<div style="margin-top: 1rem; font-size: 0.85rem;"><strong style="color: var(--neon-cyan);">Skills:</strong> <span style="color: #ddd;">${s.skills}</span></div>` : ''}
                    
                    <div style="display: flex; gap: 1rem; margin-top: 1rem; font-size: 0.85rem;">
                        ${s.github_url ? `<a href="${s.github_url}" target="_blank" style="color: #fff; text-decoration: none; display: flex; align-items: center; gap: 0.2rem;"><svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg> GitHub</a>` : ''}
                        ${s.linkedin_url ? `<a href="${s.linkedin_url}" target="_blank" style="color: #0077b5; text-decoration: none; display: flex; align-items: center; gap: 0.2rem;"><svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg> LinkedIn</a>` : ''}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('students-list').innerHTML = html;
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    function showCollegesView() {
        document.getElementById('students-view').style.display = 'none';
        document.getElementById('colleges-view').style.display = 'block';
    }
</script>
             </div>
        </div>
    </div>
    
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth('SuperAdmin');
            if (user) {
                await loadComponent('sidebar-container', '../components/super-admin-sidebar.html');
                await loadComponent('navbar-container', '../components/super-admin-navbar.html');
                
                // Highlight active sidebar link
                setTimeout(() => {
                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(link => {
                        if (link.href === window.location.href) {
                            link.classList.add('active');
                        }
                    });
                }, 100);
                
                if (typeof initPage === 'function') {
                    initPage(user);
                }
            }
        });
    </script>
</body>
</html>
