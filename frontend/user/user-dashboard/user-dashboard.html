<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | SIH Matchmaker</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
        <div id="navbar-container"></div>
        <div class="main-content animate-fade-in">
             <h2>Student Dashboard</h2>
             <hr style="border-color: var(--border-light); margin: 1rem 0 2rem 0;">
             <div id="page-content">
                <div class="glass-card" style="margin-bottom: 2rem;">
    <h3 id="welcome-msg">Welcome, Student</h3>
    <p style="color: var(--text-secondary);">Here is a quick overview of your SIH status.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
    <div class="glass-card">
        <h4 style="color: var(--neon-cyan);">My Team Status</h4>
        <p id="team-status" style="font-size: 1.5rem; font-weight: 600; margin-top: 0.5rem;">Loading...</p>
    </div>
</div>
<script>
    async function initPage(user) {
        document.getElementById('welcome-msg').innerText = `Welcome, ${user.name}!`;
        document.getElementById('team-status').innerText = user.team_id ? 'In a Team' : 'No Team Yet';
        
        if (!user.team_id) {
            document.getElementById('team-status').innerHTML += '<br><a href="user-create-team.html" style="font-size: 1rem; color: var(--neon-cyan);">Create one</a> or <a href="user-teams.html" style="font-size: 1rem; color: var(--neon-cyan);">check invites</a>';
        }
    }
</script>
             </div>
        </div>
    </div>
    
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth('User');
            if (user) {
                await loadComponent('sidebar-container', '../components/user-sidebar.html');
                await loadComponent('navbar-container', '../components/user-navbar.html');
                
                // Highlight active sidebar link
                setTimeout(() => {
                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(link => {
                        if (link.href === window.location.href) {
                            link.classList.add('active');
                        }
                    });
                }, 100);
                
                if (typeof initPage === 'function') {
                    initPage(user);
                }
            }
        });
    </script>
</body>
</html>
