<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team | SIH Matchmaker</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
        <div id="navbar-container"></div>
        <div class="main-content animate-fade-in">
             <h2>My Team</h2>
             <hr style="border-color: var(--border-light); margin: 1rem 0 2rem 0;">
             <div id="page-content">
                <div id="no-team-msg" style="display: none;" class="glass-card">
    <p>You are not in a team. <a href="user-create-team.html" style="color: var(--neon-cyan);">Create one</a>.</p>
</div>
<div id="team-content" style="display: none;">
    <div class="glass-card" style="margin-bottom: 1.5rem;">
        <h3 id="team-name" style="color: var(--neon-cyan); font-size: 2rem;"></h3>
        <p style="margin: 0.5rem 0;">Problem Statement: <span id="team-ps" style="color: var(--text-primary);"></span></p>
        <p>Status: <span id="team-status-badge" style="color: var(--text-primary); padding: 0.25rem 0.75rem; background: rgba(255,255,255,0.1); border-radius: 12px; font-size: 0.85rem;"></span></p>
    </div>
    
    <h4 style="margin-bottom: 1rem;">Team Members (<span id="member-count"></span>/6)</h4>
    <div id="members-list" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- Members injected here -->
    </div>
</div>
<script>
    async function initPage(user) {
        if (!user.team_id) {
            document.getElementById('no-team-msg').style.display = 'block';
            return;
        }
        
        document.getElementById('team-content').style.display = 'block';
        
        try {
            const team = await fetchAPI(`/teams/my-team`);
            document.getElementById('team-name').innerText = team.name;
            document.getElementById('team-ps').innerText = team.problem_statement_id;
            document.getElementById('team-status-badge').innerText = team.status;
            
            const members = team.members;
            document.getElementById('member-count').innerText = members.length;
            
            const html = members.map(m => `
                <div class="glass-card" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>${m.name}</strong> 
                        <span style="font-size: 0.8rem; color: var(--text-secondary);">(${m.gender})</span>
                    </div>
                    <div style="color: var(--text-secondary);">${m.branch} - Year ${m.year}</div>
                </div>
            `).join('');
            
            document.getElementById('members-list').innerHTML = html;
        } catch (error) {
            alert('Failed to load team details: ' + error.message);
        }
    }
</script>
             </div>
        </div>
    </div>
    
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth('User');
            if (user) {
                await loadComponent('sidebar-container', '../components/user-sidebar.html');
                await loadComponent('navbar-container', '../components/user-navbar.html');
                
                // Highlight active sidebar link
                setTimeout(() => {
                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(link => {
                        if (link.href === window.location.href) {
                            link.classList.add('active');
                        }
                    });
                }, 100);
                
                if (typeof initPage === 'function') {
                    initPage(user);
                }
            }
        });
    </script>
</body>
</html>
